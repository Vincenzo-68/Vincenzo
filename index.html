<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Thiệp sinh nhật KHỎE</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020006;
}
body{
  min-height:100dvh;
}
.scene{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#020006;
  perspective:1400px;
}

/* nền mờ chỉ để lấp khoảng trống, KHÔNG crop ảnh chính */
.backdrop{
  position:absolute;
  inset:-8%;
  background:url("thiep-khoe-v2.png?v=2") center/cover no-repeat;
  filter:blur(28px) brightness(.28) saturate(1.3);
  transform:scale(1.08);
  opacity:.75;
  animation:bgPulse 5s ease-in-out infinite alternate;
}

/* ẢNH CHÍNH: luôn hiện 100%, không bị cắt */
.stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
  animation:none;
}
.poster{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  transform-origin:center center; transform:none;
  animation:none;
  filter:saturate(1.08) contrast(1.03) brightness(.98);
}

/* lớp ánh sáng chuyển động liên tục */
.light{
  position:absolute;
  inset:-20%;
  pointer-events:none;
  mix-blend-mode:screen;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,0,190,.22),transparent 24%),
    radial-gradient(circle at 82% 32%,rgba(0,220,255,.22),transparent 24%),
    radial-gradient(circle at 55% 82%,rgba(100,0,255,.18),transparent 28%);
  animation:lightMove 4.8s ease-in-out infinite alternate;
}
.sweep{
  position:absolute;
  inset:-30%;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:.28;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,rgba(0,220,255,.25) 52%,transparent 65%);
  animation:sweep 4s linear infinite;
}
.scan{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.20;
  mix-blend-mode:screen;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 12px,
    rgba(50,220,255,.11) 13px,
    transparent 14px
  );
  animation:scanMove 3s linear infinite;
}
.spark{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  box-shadow:0 0 14px currentColor;
  animation:fly linear infinite;
}

/* Chuyển động lặp vô hạn */
@keyframes stageMove{0%,100%{transform:none}}
  50%{transform:rotateX(-.5deg) rotateY(.8deg) translate3d(2px,-2px,8px)}
  100%{transform:rotateX(.5deg) rotateY(1.1deg) translate3d(0,2px,12px)}
}
@keyframes posterPulse{0%,100%{transform:none}}
  100%{transform:scale(.995)}
}
@keyframes bgPulse{
  0%{transform:scale(1.07);filter:blur(28px) brightness(.24) saturate(1.2)}
  100%{transform:scale(1.13);filter:blur(32px) brightness(.34) saturate(1.45)}
}
@keyframes lightMove{
  0%{transform:translate3d(-3%,-2%,0) scale(1)}
  100%{transform:translate3d(3%,2%,0) scale(1.08)}
}
@keyframes sweep{
  from{transform:translateX(-35%) rotate(0.001deg)}
  to{transform:translateX(35%) rotate(0.001deg)}
}
@keyframes scanMove{
  from{transform:translateY(-18px)}
  to{transform:translateY(18px)}
}
@keyframes fly{
  0%{transform:translateY(105vh) scale(.5);opacity:0}
  10%{opacity:.9}
  85%{opacity:.8}
  100%{transform:translateY(-12vh) scale(1.3);opacity:0}
}

.fan{
  position:absolute; width:15vw; height:15vw; max-width:110px; max-height:110px;
  border-radius:50%; pointer-events:none; mix-blend-mode:screen; opacity:.28;
  background:conic-gradient(from 0deg, rgba(255,0,220,.75), rgba(0,220,255,.15), rgba(120,70,255,.75), rgba(255,0,220,.75));
  filter:blur(7px);
  animation:fanSpin 1.8s linear infinite;
}
.f1{right:4.5%;top:19%}
.f2{right:4.5%;top:34%}
.f3{right:4.5%;top:49%}
@keyframes fanSpin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="backdrop"></div>
  <div class="stage">
    <img class="poster" src="thiep-khoe-v2.png?v=2" alt="Thiệp sinh nhật KHỎE">
  </div>
  <div class="fan f1"></div><div class="fan f2"></div><div class="fan f3"></div>
  <div class="light"></div>
  <div class="sweep"></div>
  <div class="scan"></div>
</div>

<script>
const scene=document.getElementById('scene');
const colors=['#00eaff','#ff31c8','#7b4cff','#ffffff','#ff78db'];
for(let i=0;i<36;i++){
  const s=document.createElement('i');
  s.className='spark';
  const z=2+Math.random()*6;
  s.style.width=s.style.height=z+'px';
  s.style.left=(Math.random()*100)+'vw';
  s.style.color=s.style.background=colors[i%colors.length];
  s.style.animationDuration=(5+Math.random()*8)+'s';
  s.style.animationDelay=(-Math.random()*12)+'s';
  scene.appendChild(s);
}
</script>
</body>
</html>
