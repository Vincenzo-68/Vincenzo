<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thiệp sinh nhật KHỎE</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#020006;
}
.scene{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  perspective:1400px;
  background:
    radial-gradient(circle at 50% 45%,rgba(55,0,90,.35),transparent 55%),
    #020006;
}
.card-wrap{
  position:relative;
  width:100vw;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
  animation:float3d 8s ease-in-out infinite alternate;
}
.card{
  display:block;
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  transform:scale(.985);
  animation:breathe 4s ease-in-out infinite;
  filter:saturate(1.15) contrast(1.05) brightness(.96);
  user-select:none;
  -webkit-user-drag:none;
}
.glow{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,0,190,.18),transparent 26%),
    radial-gradient(circle at 80% 35%,rgba(0,220,255,.18),transparent 24%),
    radial-gradient(circle at 65% 78%,rgba(115,0,255,.18),transparent 28%);
  animation:glowMove 6s ease-in-out infinite alternate;
}
.scan{
  position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:screen;
  background:linear-gradient(transparent 46%,rgba(70,240,255,.16) 50%,transparent 54%);
  background-size:100% 22px;
  animation:scan 4s linear infinite;
}
.rgb{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.13;
  background:linear-gradient(120deg,transparent 20%,rgba(255,0,180,.20) 40%,rgba(0,220,255,.20) 60%,transparent 80%);
  animation:rgbSweep 5s linear infinite;
}
.spark{
  position:absolute;border-radius:50%;pointer-events:none;
  box-shadow:0 0 12px currentColor;
  animation:fly linear infinite;
}
@keyframes float3d{
  0%{transform:rotateX(.7deg) rotateY(-1.2deg) translate3d(-.3%,0,0)}
  50%{transform:rotateX(-.5deg) rotateY(.8deg) translate3d(.3%,-.2%,6px)}
  100%{transform:rotateX(.6deg) rotateY(1.2deg) translate3d(0,.3%,10px)}
}
@keyframes breathe{
  0%,100%{transform:scale(.985);filter:saturate(1.10) contrast(1.03) brightness(.94)}
  50%{transform:scale(1);filter:saturate(1.20) contrast(1.07) brightness(1.02)}
}
@keyframes glowMove{
  0%{transform:translate3d(-2%,-1%,0)}
  100%{transform:translate3d(2%,1%,0)}
}
@keyframes scan{
  from{transform:translateY(-12%)}
  to{transform:translateY(12%)}
}
@keyframes rgbSweep{
  from{transform:translateX(-35%)}
  to{transform:translateX(35%)}
}
@keyframes fly{
  from{transform:translateY(105vh) scale(.5);opacity:0}
  15%{opacity:.8}
  to{transform:translateY(-10vh) scale(1.2);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .card-wrap,.card,.glow,.scan,.rgb,.spark{animation:none}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="card-wrap">
    <img class="card" src="thiep-khoe.png" alt="Thiệp sinh nhật KHỎE">
  </div>
  <div class="glow"></div>
  <div class="scan"></div>
  <div class="rgb"></div>
</div>
<script>
const scene=document.getElementById('scene');
const colors=['#00eaff','#ff31c8','#7b4cff','#fff'];
for(let i=0;i<30;i++){
  const s=document.createElement('i');
  s.className='spark';
  const z=2+Math.random()*6;
  s.style.width=s.style.height=z+'px';
  s.style.left=Math.random()*100+'vw';
  s.style.color=s.style.background=colors[i%colors.length];
  s.style.animationDuration=(6+Math.random()*8)+'s';
  s.style.animationDelay=(-Math.random()*12)+'s';
  scene.appendChild(s);
}
</script>
</body>
</html>
