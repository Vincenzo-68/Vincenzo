<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thiệp sinh nhật KHỎE</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020006}
.scene{position:fixed;inset:0;overflow:hidden;perspective:1200px;background:#020006}
.card{position:absolute;inset:-6%;background:url("thiep-khoe.png") center/cover no-repeat;
 transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.12);
 transition:transform .08s linear;will-change:transform;filter:saturate(1.12) contrast(1.04)}
.glow{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;
 background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(0,220,255,.24),transparent 22%),
 radial-gradient(circle at 20% 25%,rgba(255,0,190,.17),transparent 30%),
 radial-gradient(circle at 82% 65%,rgba(105,0,255,.20),transparent 30%);
 animation:pulse 3s ease-in-out infinite alternate}
.scan{position:absolute;inset:-10%;pointer-events:none;opacity:.25;mix-blend-mode:screen;
 background:linear-gradient(transparent 47%,rgba(70,240,255,.18) 50%,transparent 53%);
 background-size:100% 18px;animation:scan 5s linear infinite}
.spark{position:absolute;border-radius:50%;pointer-events:none;box-shadow:0 0 12px currentColor;
 animation:fly linear infinite}
@keyframes pulse{to{transform:scale(1.08);opacity:.75}}
@keyframes scan{from{transform:translateY(-8%)}to{transform:translateY(8%)}}
@keyframes fly{from{transform:translateY(110vh) scale(.5);opacity:0}15%{opacity:.9}to{transform:translateY(-15vh) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.glow,.scan,.spark{animation:none}.card{transition:none}}
</style>
</head>
<body>
<div class="scene" id="scene"><div class="card"></div><div class="glow"></div><div class="scan"></div></div>
<script>
const root=document.documentElement, scene=document.getElementById('scene');
function tilt(x,y){
 root.style.setProperty('--ry',((x-.5)*9)+'deg');
 root.style.setProperty('--rx',((.5-y)*7)+'deg');
 root.style.setProperty('--x',(x*100)+'%'); root.style.setProperty('--y',(y*100)+'%');
}
addEventListener('pointermove',e=>tilt(e.clientX/innerWidth,e.clientY/innerHeight));
addEventListener('deviceorientation',e=>{
 if(e.gamma==null||e.beta==null)return;
 tilt(Math.max(0,Math.min(1,.5+e.gamma/90)),Math.max(0,Math.min(1,.5+(e.beta-45)/120)));
},true);
const cs=['#00eaff','#ff31c8','#7b4cff','#fff'];
for(let i=0;i<32;i++){const s=document.createElement('i');s.className='spark';
 let z=2+Math.random()*7;s.style.width=s.style.height=z+'px';s.style.left=Math.random()*100+'vw';
 s.style.color=s.style.background=cs[i%cs.length];s.style.animationDuration=(5+Math.random()*8)+'s';
 s.style.animationDelay=(-Math.random()*12)+'s';scene.appendChild(s);}
</script>
</body></html>
