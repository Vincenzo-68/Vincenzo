<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thiệp sinh nhật KHỎE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020006}
.scene{
  position:fixed;inset:0;overflow:hidden;perspective:1400px;background:#020006;
}
.card{
  position:absolute;inset:-7%;
  background:url("thiep-khoe.png") center/cover no-repeat;
  transform-style:preserve-3d;
  will-change:transform,filter;
  animation:float3d 8s ease-in-out infinite alternate, breathe 4s ease-in-out infinite;
  filter:saturate(1.15) contrast(1.05) brightness(.94);
}
.glow{
  position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,0,190,.20),transparent 28%),
    radial-gradient(circle at 80% 35%,rgba(0,220,255,.22),transparent 25%),
    radial-gradient(circle at 65% 78%,rgba(115,0,255,.20),transparent 28%);
  animation:glowMove 6s ease-in-out infinite alternate;
}
.scan{
  position:absolute;inset:-15%;pointer-events:none;opacity:.28;mix-blend-mode:screen;
  background:linear-gradient(transparent 46%,rgba(70,240,255,.20) 50%,transparent 54%);
  background-size:100% 22px;
  animation:scan 3.8s linear infinite;
}
.rgb{
  position:absolute;inset:-10%;pointer-events:none;mix-blend-mode:screen;opacity:.18;
  background:linear-gradient(120deg,transparent 20%,rgba(255,0,180,.25) 40%,rgba(0,220,255,.25) 60%,transparent 80%);
  animation:rgbSweep 4.5s linear infinite;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 120px rgba(0,0,0,.45);
}
.spark{
  position:absolute;border-radius:50%;pointer-events:none;
  box-shadow:0 0 14px currentColor;
  animation:fly linear infinite;
}
@keyframes float3d{
  0%{transform:rotateX(1.5deg) rotateY(-2.8deg) scale(1.11) translate3d(-1%,0,0)}
  50%{transform:rotateX(-1deg) rotateY(2deg) scale(1.13) translate3d(1%,-.5%,10px)}
  100%{transform:rotateX(1.2deg) rotateY(3.2deg) scale(1.12) translate3d(0,1%,20px)}
}
@keyframes breathe{
  0%,100%{filter:saturate(1.10) contrast(1.03) brightness(.92)}
  50%{filter:saturate(1.23) contrast(1.08) brightness(1.03)}
}
@keyframes glowMove{
  0%{transform:translate3d(-3%,-2%,0) scale(1)}
  100%{transform:translate3d(3%,2%,0) scale(1.08)}
}
@keyframes scan{
  from{transform:translateY(-15%)}
  to{transform:translateY(15%)}
}
@keyframes rgbSweep{
  from{transform:translateX(-45%)}
  to{transform:translateX(45%)}
}
@keyframes fly{
  from{transform:translate3d(0,110vh,0) scale(.5);opacity:0}
  12%{opacity:.9}
  85%{opacity:.8}
  to{transform:translate3d(0,-15vh,120px) scale(1.4);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .card,.glow,.scan,.rgb,.spark{animation:none}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="card"></div>
  <div class="glow"></div>
  <div class="scan"></div>
  <div class="rgb"></div>
  <div class="vignette"></div>
</div>

<script>
const scene=document.getElementById('scene');
const colors=['#00eaff','#ff31c8','#7b4cff','#ffffff','#ff6bd6'];

for(let i=0;i<42;i++){
  const s=document.createElement('i');
  s.className='spark';
  const z=2+Math.random()*7;
  s.style.width=s.style.height=z+'px';
  s.style.left=Math.random()*100+'vw';
  s.style.color=s.style.background=colors[i%colors.length];
  s.style.animationDuration=(5+Math.random()*8)+'s';
  s.style.animationDelay=(-Math.random()*12)+'s';
  scene.appendChild(s);
}
</script>
</body>
</html>
